name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build (${{ matrix.target_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_name: windows-x64
          - os: ubuntu-latest
            target_name: linux-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libudev-dev \
            libxkbcommon-dev libx11-dev libwayland-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Build release binaries
        run: cargo build --release --workspace

      - name: Package Windows release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/open-atk-windows-x64 | Out-Null
          Copy-Item target/release/open-atk.exe dist/open-atk-windows-x64/
          Copy-Item target/release/vxectl.exe dist/open-atk-windows-x64/
          Copy-Item packaging/install.ps1 dist/open-atk-windows-x64/
          Copy-Item README.md, LICENSE dist/open-atk-windows-x64/
          Compress-Archive -Path dist/open-atk-windows-x64/* -DestinationPath open-atk-windows-x64.zip -Force

      - name: Package Linux release archive
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/open-atk-linux-x64/packaging
          cp target/release/open-atk dist/open-atk-linux-x64/
          cp target/release/vxectl dist/open-atk-linux-x64/
          cp packaging/install.sh packaging/71-open-atk.rules packaging/open-atk.desktop dist/open-atk-linux-x64/packaging/
          cp README.md LICENSE dist/open-atk-linux-x64/
          tar -czf open-atk-linux-x64.tar.gz -C dist open-atk-linux-x64

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: open-atk-${{ matrix.target_name }}
          path: |
            open-atk-windows-x64.zip
            open-atk-linux-x64.tar.gz
          if-no-files-found: ignore

  publish-release:
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/open-atk-windows-x64.zip
            artifacts/open-atk-linux-x64.tar.gz

